<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>こもれび喫茶 · iPhoneプレビュー</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:100%;height:100%;margin:0;overflow:hidden; }
    body { display:flex;flex-direction:column;align-items:center;background:#211a17;color:#e8d3b3;font:12px/1.4 sans-serif; }
    header { flex:none;padding:8px;text-align:center; }
    main { width:100%;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden; }
    #frame { width:393px;height:793px;flex:none; }
    iframe { display:block;width:393px;height:793px;border:0;transform-origin:top left;background:#fffaf0; }
  </style>
</head>
<body>
  <header>iPhoneプレビュー · ゲーム領域 393 × 793</header>
  <main id="area"><div id="frame"><iframe src="/" title="iPhoneサイズのこもれび喫茶" allow="autoplay"></iframe></div></main>
  <script>
    // IMG_9398.PNG: 1179×2556 at 3×, minus the 59px iOS status bar.
    // Scale the view without changing the iframe viewport or media queries.
    const area=document.getElementById('area');
    const frame=document.getElementById('frame');
    const game=document.querySelector('iframe');
    function fit() {
      const scale=Math.min(1,area.clientWidth/393,area.clientHeight/793);
      frame.style.width=`${393*scale}px`;
      frame.style.height=`${793*scale}px`;
      game.style.transform=`scale(${scale})`;
    }
    new ResizeObserver(fit).observe(area);
    fit();
  </script>
</body>
</html>
